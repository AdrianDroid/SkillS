        - paragraph [ref=f19e5522]: 港股即時基本市場行情由香港交易所提供; 香港交易所指定免費發放即時基本市場行情的網站。
        - paragraph [ref=f19e5523]: 招股最後一天正午12時截止，星期六日公眾假期休息。
        - paragraph [ref=f19e5524]: 入場費包括交易徵費，分別為經紀佣金 1%，證監會交易徵費 0.0027%，聯交所交易費 0.00565%，總數為 1.00835%；於2022年1月1日後認購新股須繳付財務匯報局交易徵費 0.00015%， 總數為 1.0085%。
        - paragraph [ref=f19e5525]: “申請上市”資訊只供參考，如有更改以聯交所最後發佈為準。當“申請上市”公司通過聆訊並有確實上市時間表後，該公司的上市資訊將移到相關招股資訊部分。
        - paragraph [ref=f19e5526]: 上述資料來自招股文件，只供參考，如有更改以上市公司最後發佈為準，投資者宜詳閱有關資料始作出投資決定。
