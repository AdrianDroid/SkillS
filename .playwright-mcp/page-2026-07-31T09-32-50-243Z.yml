            - generic [ref=f128e65]:
              - paragraph [ref=f128e66]: The Fund invests principally in a portfolio of fixed and floating rate corporate bonds, notes and other fixed and floating rate income securities that are either secured or unsecured, and, either senior or subordinated (i.e. non-senior), focusing primarily on North American and European senior secured high yield (i.e. sub-investment grade) instruments which are listed or traded on recognised markets in Europe or North America.
              - paragraph [ref=f128e67]: The Fund is subject to risks relating to investment, credit, interest rate fluctuations, downgrading, valuation, credit rating, and currency risks. The Fund’s investment may be concentrated in North American and European markets and the value of the Fund may be more volatile.
              - paragraph [ref=f128e68]: The Fund’s investment in sub-investment grade or unrated debt instruments may be subject to higher liquidity, volatility and credit risks than investment grade instruments, as well as increased risk of loss of principal and interest. Investment in senior secured debt instruments is subject to credit/default risk of the issuer of the debt instruments and there is no guarantee of the repayment of principal of investment from the collateral pledged for the debt instruments in case of default.
              - paragraph [ref=f128e69]: RMB classes are subject to RMB currency risks. RMB is currently not freely convertible and conversion of RMB is subject to foreign exchange control policies and restrictions. There is no guarantee that RMB will not be subject to depreciation. Under exceptional circumstances, payment of realisation proceeds and/or dividend payment from underlying investments to the Fund in RMB may be delayed.
              - paragraph [ref=f128e70]: The Manager integrates environmental, social and governance (ESG) information into the investment process, which may affect the Fund’s investment performance and, as such, may perform differently compared to similar collective investment schemes.
              - paragraph [ref=f128e71]: The Fund may invest in derivatives for hedging and/or investment purposes which may involve counterparty/credit, liquidity, valuation, volatility and over-the-counter transaction risks. Exposure to derivatives may lead to a high risk of significant loss by the Fund.
              - paragraph [ref=f128e72]: The Fund’s investment in debt instruments with loss-absorption features (“LAP”) are subject to risks of contingent write-down or contingent conversion to ordinary shares upon occurrence of complex and unpredictable trigger events which may result in higher price volatility and total loss of amount invested. LAP may also be exposed to liquidity, valuation and sector concentration risk.
              - paragraph [ref=f128e73]: Dividends, at the discretion of the Directors, may be paid out of unrealised capital gains and/or gross income while charging some or all fees and expenses out of capital (which represent effectively paying dividends out of capital), resulting in an increase in distributable income. The Fund may also pay dividends directly out of capital. Payment of dividends out of capital amounts to a return or withdrawal of part of an investor’s original investment or any capital gains attributable to that original investment and results in an immediate reduction of the Fund’s net asset value per share.
              - paragraph [ref=f128e74]: Investors may suffer substantial loss of their investments in the Fund.
