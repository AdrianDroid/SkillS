          - paragraph [ref=f189e168]: (i) Other institutional investors
          - paragraph [ref=f189e169]: "(2) Large undertakings meeting two of the following size requirements on a company basis:"
          - paragraph [ref=f189e170]: "— balance sheet total: EUR 20,000,000,"
          - paragraph [ref=f189e171]: "— net turnover: EUR 40,000,000,"
          - paragraph [ref=f189e172]: "— own funds: EUR 2,000,000."
          - paragraph [ref=f189e173]: (3) National and regional governments, public bodies that manage public debt, Central Banks, international and supranational institutions such as the World Bank, the IMF, the ECB, the EIB and other similar international organisations.
          - paragraph [ref=f189e174]: (4) Other institutional investors whose main activity is to invest in financial instruments, including entities dedicated to the securitisation of assets or other financing transactions.
          - paragraph [ref=f189e175]
          - paragraph [ref=f189e176]: High net worth companies, include:(i) a body corporate which has a called-up share capital or net assets of at least £5 million;(ii) an unincorporated association or partnership which has net assets of at least £5 million;(iii) the trustee of a trust with assets (before deducting any liabilities) of at least £10 million or which were at least £10 million within the previous year; or(iv) a person acting in his capacity as a director, officer or employee of a person of a type described in paragraphs (i) to (iii) above (i.e. he must not be acting on his own personal account) whose responsibilities, when acting in his capacity as a director, officer or employee of such person, involve him in engaging in regulated activities.
