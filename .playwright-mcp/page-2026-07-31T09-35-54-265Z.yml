          - paragraph [ref=f189e159]: "(1) Entities which are required to be authorised or regulated to operate in the financial markets. The list below should be understood as including all authorised entities carrying out the characteristic activities of the entities mentioned: entities authorised by a Member State under a Directive, entities authorised or regulated by a Member State without reference to a Directive, and entities authorised or regulated by a non-Member State:"
