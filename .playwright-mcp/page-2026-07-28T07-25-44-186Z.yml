              - generic [ref=f153e45]:
                - generic [ref=f153e46]: "您的投資者身份:"
                - generic [ref=f153e47]: 個人投資者
              - paragraph [ref=f153e49]: 如果您管理自己的資金或接受專業投資建議，請訪問本網站。
              - generic [ref=f153e50]:
                - generic [ref=f153e51]: 選擇你的語言
                - listbox "選擇你的語言" [ref=f153e52] [cursor=pointer]:
