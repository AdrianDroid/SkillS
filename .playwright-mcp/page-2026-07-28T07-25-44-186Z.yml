                - paragraph [ref=f153e218]: 什麼是cookie?
                - paragraph [ref=f153e219]: Cookie 的使用在網路上非常普遍。Cookie是一種包含資訊的小型文字檔案。在您的終端機（例如電腦、平板電腦、智慧型手機等）的硬碟上記錄您透過瀏覽器軟體造訪網站。它由網站伺服器傳輸到您的瀏覽器。Cookie 檔案可讓其發行者識別在相關 Cookie 的有效期或註冊期間內記錄該檔案的終端。 Cookie 無法追溯到自然人。
                - paragraph [ref=f153e220]: 我們為什麼要使用cookies？
                - paragraph [ref=f153e221]: 我們使用 3 類 cookie，其用途如下所述。我們不使用 cookie 來收集個人資訊（例如姓名）。
                - paragraph [ref=f153e222]: 1. 功能cookies
                - paragraph [ref=f153e223]: 這些 cookie 對於瀏覽我們的網站並不是必不可少的，但可以優化其功能並授予網路使用者對特定功能的存取權。
                - paragraph [ref=f153e224]: 它們還允許我們網站應每個終端的顯示偏好而呈現。
                - paragraph [ref=f153e225]: 因此，這些 cookie 可確保流暢且量身訂製的瀏覽。
                - paragraph [ref=f153e226]: 在終端上放置 cookie 是個人化和改善使用者體驗的最簡單、最快的方法。
                - paragraph [ref=f153e227]: 這些 cookie 由 Amundi 安裝。在大多數情況下，它們的有效期非常短，最多為期一年。
                - paragraph [ref=f153e228]: 2. 受眾測量cookie（統計）
                - paragraph [ref=f153e229]: 這些 cookie 會收集訪客如何使用網站的資訊。例如，造訪次數、造訪次數最多的頁面…
