              - generic [ref=f153e56]:
                - paragraph [ref=f153e57]: 重要法律資訊。請仔細閱讀此條款及細則。
                - paragraph [ref=f153e58]: 閣下正進入東方匯理資產管理香港有限公司的網站。在繼續瀏覽網站之前，請您仔細閱讀此頁。 使用此網站及其中網頁，即代表您已閱讀、接受並同意遵守以下條款。 如果您不同意全部條款，您不應使用本網站及其中網頁。
                - paragraph [ref=f153e59]
                - paragraph [ref=f153e60]: 東方匯理系列基金
                - list [ref=f153e61]:
                  - listitem [ref=f153e62]:
                    - paragraph [ref=f153e63]: 東方匯理系列基金是包含不同子基金的傘子基金，子基金類型包括股票子基金、債券子基金及多元資產子基金，風險狀況各異。
                  - listitem [ref=f153e64]:
                    - paragraph [ref=f153e65]: 部分子基金可能投資於單一國家或行業板塊，因此集中風險可能較高。與廣泛投資的基金相比，這些子基金的投資焦點的波幅或較高。
                  - listitem [ref=f153e66]:
                    - paragraph [ref=f153e67]: 雖然部分子基金不會廣泛使用衍生工具作投資用途或採用複雜的衍生工具或策略，偶爾使用衍生工具及/或按揭證券和資產抵押證券或須承受發行人的信貸、流動性、對手方、估值及場外交易風險。金融衍生工具的使用及其槓桿元素可能導致子基金須承受錄得重大損失的高風險。部分子基金可能會廣泛使用衍生工具作投資用途或使用複雜的衍生工具或策略，可能須承受額外較高槓桿水平及波動風險。
                  - listitem [ref=f153e68]:
                    - paragraph [ref=f153e69]: 部分子基金可能投資於中小型公司或因此須承受較高之風險。
                  - listitem [ref=f153e70]:
                    - paragraph [ref=f153e71]: 個別子基金可能投資於新興市場，或須承受政治、經濟和政策改變等風險，將為基金帶來額外風險。這些子基金將較波動，並比投資於已發展地區的子基金較少流動性。
                  - listitem [ref=f153e72]:
                    - paragraph [ref=f153e73]: 部分子基金可能投資於債券及/或新興市場綠色債券，或會承受利率、信貸及預付及匯兌的風險。當中包括高通脹率及利率、巨額外債、政治及社會上之不明朗因素，以及與新興市場綠色債券相關的風險。
                  - listitem [ref=f153e74]:
                    - paragraph [ref=f153e75]: 部份子基金可能投資於可轉換債券、高收益、非投資級別及無評級的證券，可能須承受較高風險包括但不限於違約、降級、利率、信貸及流動性風險。
                  - listitem [ref=f153e76]:
                    - paragraph [ref=f153e77]: 就人民幣類別而言，由於人民幣不能自由兌換，投資於本基金的人民幣類別可能會因人民幣與其他外幣之間的匯率變動及人民幣的流動性而受到不利的影響。在收到大量人民幣類別贖回要求的情況下，基金經理有絕對酌情權延遲支付人民幣類別的贖回要求。
                  - listitem [ref=f153e78]:
                    - paragraph [ref=f153e79]: 就分派類別而言，本基金可酌情決定以本基金的收入或資本或實際上從本基金的資本中支付股息。從資本支付股息及／或實際上從資本中支付股息相當於退還或提取投資者部分原有之投資或任何歸屬於該原有投資的資本收益。任何涉及從本基金的資本中支付股息或實際上從本基金的資本中支付股息（視情況而定）均可導致本基金每股資產淨值即時減少。
                  - listitem [ref=f153e80]:
                    - paragraph [ref=f153e81]: 本基金的價值可能會非常波動，且可能在短時間內大幅下跌，令投資者蒙受重大損失。
                  - listitem [ref=f153e82]:
                    - paragraph [ref=f153e83]: 這是您個人的投資決定，除非推介該投資產品給您的顧問已指出該產品適合您本人及已向您說明該產品如何符合您的投資目標，否則您不應投資於該產品。
                - paragraph [ref=f153e84]
                - paragraph [ref=f153e85]: 東方匯理亞洲傘子基金
                - list [ref=f153e86]:
                  - listitem [ref=f153e87]:
                    - paragraph [ref=f153e88]: 東方匯理亞洲傘子基金是包含不同子基金的傘子基金。子基金是綜合基金中的基金，將至少80%的淨資產投資於UCITS（可轉讓證券集體投資計劃）／UCI（集體投資計劃）。
                  - listitem [ref=f153e89]:
                    - paragraph [ref=f153e90]: 投資於本基金或會承受外匯／貨幣風險、集中風險、新興市場風險、歐元區風險、以及投資於其他計劃。
                  - listitem [ref=f153e91]:
                    - paragraph [ref=f153e92]: 部份子基金涉及與Standard Chartered的CIO篩選策略有關的風險、使用Standard Chartered的CIO篩選策略的權利被終止的風險、債務證券相關風險（包括信貸／對手方風險、利率風險、低於投資級／無評級債券風險、主權債務風險、波動性及流動性風險、降級風險、估值風險和信貸評級風險）、以及投資於有抵押及／或證券化產品的風險。
                  - listitem [ref=f153e93]:
                    - paragraph [ref=f153e94]: 部份子基金涉及投資於其他計劃的風險、與基金的投資策略有關的風險、與DBS之間簽署的投資顧問協議終止的風險，以及債務證券相關風險（包括信貸／對手方風險、利率風險、主權債務風險、低於投資級債券風險、波動性及流動性風險、降級風險、估值風險和信貸評級風險）。
                  - listitem [ref=f153e95]:
                    - paragraph [ref=f153e96]: 本基金可投資於可大量使用金融衍生工具作投資用途的相關計劃，或衍生工具風險承擔淨額超過其資產淨值50%的相關計劃。投資於金融衍生工具須承受額外風險，包括對手方風險及信貸風險、流動性風險、估值風險、波動風險及場外交易風險。金融衍生工具的槓桿元素／成分可能導致基金蒙受損失。
                  - listitem [ref=f153e97]:
                    - paragraph [ref=f153e98]: 就派息股份類別而言，本基金可酌情決定以本基金的收入或資本或實際上從本基金的資本中支付股息。從資本支付股息及／或實際上從資本中支付股息相當於退還或提取投資者部分原有之投資或任何歸屬於該原有投資的資本收益。任何涉及從本基金的資本中支付股息或實際上從本基金的資本中支付股息（視情況而定）均可導致本基金每股資產淨值即時減少。
                  - listitem [ref=f153e99]:
                    - paragraph [ref=f153e100]: 本基金的價值可能會波動，且可能在短時間內大幅下跌，令投資者蒙受損失。
                  - listitem [ref=f153e101]:
                    - paragraph [ref=f153e102]: 投資者不可單靠本文而作出投資決定。
                - paragraph [ref=f153e103]
                - paragraph [ref=f153e104]: 東方匯理香港–綠色環球基金
                - list [ref=f153e105]:
                  - listitem [ref=f153e106]:
                    - paragraph [ref=f153e107]: 子基金主要投資於某些公司，對有關公司進行投資是根據 (1)有關公司的環境評級及(2)有關公司的財務表現預測，以使投資基金取得超越MSCI World 指數的中長期表現。
                  - listitem [ref=f153e108]:
                    - paragraph [ref=f153e109]: 投資在子基金可能需要承受ESG投資政策風險、集中風險及與中小型公司有關之投資風險。運用金融衍生工具作對沖用途可能須承受額外風險，包括發行人的信貸風險、流動性風險、對手方風險及估值風險。
                  - listitem [ref=f153e110]:
                    - paragraph [ref=f153e111]: 由於人民幣不能自由兌換，投資於本基金的人民幣類別可能會因人民幣與其他外幣之間的匯率變動及人民幣的流動性而受到不利的影響。在收到大量人民幣類別贖回要求的情況下，基金經理有絕對酌情權延遲支付人民幣類別的贖回要求。
                  - listitem [ref=f153e112]:
                    - paragraph [ref=f153e113]: 就分派類別而言，基金經理可酌情決定從本基金的收入或資本支付股息，而同時於／從本基金的資本記入／支付本基金全部或部分費用及支出，以致增加本基金用作支付股息的可分派收入，因此本基金實際上可從資本支付股息。從資本中支付股息的情況相當於退還或提取投資者部分原有的投資或原有投資的資本收益。上述分派可能導致基金每單位資產淨值即時減少。
                  - listitem [ref=f153e114]:
                    - paragraph [ref=f153e115]: 本基金的價值可能會波動及可能需要承受重大損失。
                  - listitem [ref=f153e116]:
                    - paragraph [ref=f153e117]: 投資者不可單靠本文而作出投資決定。
                - paragraph [ref=f153e118]
                - paragraph [ref=f153e119]: 東方匯理香港組合
                - list [ref=f153e120]:
                  - listitem [ref=f153e121]:
                    - paragraph [ref=f153e122]: 東方匯理香港組合是根據信託契據組成為傘子基金的單位信託基金，其中包括不同的子基金投資於股票、債券及貨幣市場工具及其他投資基金。每一個均有不同風險概況。
                  - listitem [ref=f153e123]:
                    - paragraph [ref=f153e124]: 部分子基金可能直接或間接透過全球股票及定息工具中的相關基金投資，將面對的是市場風險、包括（但不限於）與下列各項相關風險：(1)股價波動；(2)利率變動；及(3)現行匯率變動，同時面對流動性、信用及交易對手風險。當中包括降級風險和主權債務危機風險。部分子基金可能投資於中小型公司及新興市場或會涉及較高程度的風險。
                  - listitem [ref=f153e125]:
                    - paragraph [ref=f153e126]: 部分子基金可能運用金融衍生工具以達到對沖、有效投資組合管理及或投資目的，或可能承受額外風險；包括發行人的信貸、流動性、對手方及估值風險。
                  - listitem [ref=f153e127]:
                    - paragraph [ref=f153e128]: 投資於相關投資基金的子基金可能面對影響相關投資基金的風險。
                  - listitem [ref=f153e129]:
                    - paragraph [ref=f153e130]: 就對沖類別而言，每個對沖類別的單位將以子基金的基數貨幣對沖其計值貨幣，在盡最大努力的基礎上，以使對沖類別的表現緊貼以基金基數貨幣計值的同等類別的表現為目標。然而，概不保證基金經理運用的對沖技巧會充分而且有效地達至理想的結果和效用。此外，對沖類別的波動可能高於以基金基數貨幣計值的同等類別。如用作對沖的投資工具的對手方違約，對沖類別的投資者或須承受相關計值貨幣的非對沖貨幣匯率風險，並可能因此蒙受進一步的損失。投資者須承擔有關對沖費用，對沖費用可能不少，視乎當時市況而定。
                  - listitem [ref=f153e131]:
                    - paragraph [ref=f153e132]: 就分派類別而言，基金經理可酌情決定從本基金的收入或資本支付股息，而同時於／從本基金的資本記入／支付本基金全部或部分費用及支出，以致增加本基金用作支付股息的可分派收入，因此本基金實際上可從資本支付股息。從資本中支付股息的情況相當於退還或提取投資者部分原有的投資或原有投資的資本收益。上述分派可能導致基金每單位資產淨值即時減少。就分派II類別而言，每季的分派並不獲保證，而在支付每季股息之後，基金就此股份類別可供投資的資產將進一步減少。
                  - listitem [ref=f153e133]:
                    - paragraph [ref=f153e134]: 東方匯理香港組合 - 靈活配置均衡基金，靈活配置平穩基金，靈活配置增長基金，亞太新動力股息基金和創新動力股票基金將有限度地作出人民幣計值的相關投資。
                  - listitem [ref=f153e135]:
                    - paragraph [ref=f153e136]: 由於人民幣不能自由兌換，投資於本基金的人民幣類別可能會因人民幣與其他外幣之間的匯率變動及人民幣的流動性而受到不利的影響。在收到大量人民幣類別贖回要求的情況下，基金經理有絕對酌情權延遲支付人民幣類別的贖回要求。
                  - listitem [ref=f153e137]:
                    - paragraph [ref=f153e138]: 東方匯理香港組合– 美元貨幣市場基金屬於聯接基金，而相關基金在香港不是貨幣市場基金。相關基金並不提供任何保證。相關基金的股份與在銀行或接受存款公司存放資金並不相同。
                  - listitem [ref=f153e139]:
                    - paragraph [ref=f153e140]: 東方匯理香港組合-創新動力股票基金主要投資於破格性創新公司或須承受較高的市場波動和周轉率，而可能須承受重大損失。
                  - listitem [ref=f153e141]:
                    - paragraph [ref=f153e142]: 本子基金的價值可能會非常波動，且可能在短時間內大幅下跌，令投資者蒙受損失。
                  - listitem [ref=f153e143]:
                    - paragraph [ref=f153e144]: 這是您個人的投資決定，除非推介該投資產品給您的顧問已指出本基金的子基金適合您本人及已向您說明該子基金如何符合您的投資目標，否則您不應投資於該產品。
                - paragraph [ref=f153e145]
                - paragraph [ref=f153e146]: 東方匯理越南機會基金
                - list [ref=f153e147]:
                  - listitem [ref=f153e148]:
                    - paragraph [ref=f153e149]: 本子基金屬於股票基金。
                  - listitem [ref=f153e150]:
                    - paragraph [ref=f153e151]: 本子基金投資於單一市場，須承受相對較多元化投資為高的集中及流動性風險。
                  - listitem [ref=f153e152]:
                    - paragraph [ref=f153e153]: 本子基金投資於新興市場，須承受較高風險，包括貨幣風險。
                  - listitem [ref=f153e154]:
                    - paragraph [ref=f153e155]: 本基金的價值可能會非常波動，且可能在短時間內大幅下跌，令投資者蒙受損失。
                  - listitem [ref=f153e156]:
                    - paragraph [ref=f153e157]: 這是您個人的投資決定，除非推介該投資產品給您的顧問已指出該產品適合您本人及已向您說明該產品如何符合您的投資目標，否則您不應投資於該產品。
                - paragraph [ref=f153e158]
                - paragraph [ref=f153e159]: 東方匯理恒生香港35指數ETF
                - paragraph [ref=f153e160]: 東方匯理恒生香港35指數ETF（以下簡稱「HSHK 35 ETF」）是一隻實物資產交易所買賣基金，旨在提供在扣除費用及開支前緊貼恒生香港35指數(「相關指數」)表現的投資業績。
                - list [ref=f153e161]:
                  - listitem [ref=f153e162]:
                    - paragraph [ref=f153e163]: 投資涉及風險，投資者可能會損失重大部分其於HSHK35 ETF之投資, 並應特別留意HSHK35 ETF投資的股票須承受市場風險 。
                  - listitem [ref=f153e164]:
                    - paragraph [ref=f153e165]: 由於HSHK35 ETF於香港聯合交易所有限公司上市，所以跟常見的單位信託基金有所不同，而HSHK35 ETF所附帶的風險與其他上市股票相類似，例如：流通性風險及可能會停止買賣的風險。每基金單位的市價可受二級市場中市場供求、流通性及買賣價差等因素影 響，而顯著地高於或低於其每基金單位的資產淨值，每基金單位的市價亦將會於交易日內不斷波動。
                  - listitem [ref=f153e166]:
                    - paragraph [ref=f153e167]: HSHK35 ETF須承受追蹤誤差風險、被動式投資所涉及之風險及投資於單一市場/該指數數隻成份股之集中風險。
                  - listitem [ref=f153e168]:
                    - paragraph [ref=f153e169]: HSHK35 ETF亦受雙櫃台風險、人民幣交易及結算風險、外匯風險，及依賴莊家之風險。
                  - listitem [ref=f153e170]:
