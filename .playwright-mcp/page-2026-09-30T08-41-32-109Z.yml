      - paragraph [ref=e140]:
        - strong [ref=e141]: 主題判斷：
        - text: 同步的石油供應衝擊式再收緊週期，而非需求強勁型：聯儲局／歐央行／日銀於 9 月 16–18 日三天內同步轉鷹，聯儲局點陣圖修訂至 2028 年前不減息，10 年期 5.26% 為 2026 年高點，2s10s 壓縮至 37bp 的年度最平且屬熊平，而 2 年期 4.89% 較該委員會自己的 YE2026 中位數 4.1% 還要多定價約 80bp。核心 PCE 3.3% 高於核心 CPI 2.4% 近 90bp，而聯儲局是以較熱的那個為準。第二主題是 AI 資本開支同時是資產類別與通脹輸入——日銀聲明本身點名 AI 需求推高日本核心 CPI 至 2% 以上。第三是中國按兵不動（LPR 約 16 個月不變，人民幣 YTD +3.9% 正是寬鬆的約束）。第四且最反直覺：**黃金本輪未能作為通脹對沖**——4,194 美元、YTD −2.89%、距 52 週高 5,598.75 下跌 25.10%，而同期布蘭特上漲 58.3%；黃金是零收益的久期代理，10 年期上升 107bp 令實際利率走高，於是油價最脹的一年黃金卻下跌。第五是分化未被定價：VIX 16.04，SOXX +83.9% 與 EWY +85.2% 接近新高，而恒指 YTD −4.4%、FXI −14.2%、KOSPI 距高 −27%。
      - paragraph [ref=e142]:
        - strong [ref=e143]: 對本計劃的含義：
        - text: 對本計劃的含義：(1) **唯一的 OW 是 AI 資本開支**，但最明顯的表達方式是錯的——專門科技線只有 5 隻，OCF 1.80–2.11%（約為全計劃 p75）、3 年 Sharpe 中位數 1.03、5 年 Sharpe 為零；同一因子可經更深的股票區塊（Global 38 隻）與 APAC 內的台灣／韓國線取得，且價格已反映熱度（SOXX +83.9% YTD）。(2) **油衝擊的久期傷害**是本計劃最乾淨的表達：兩隻 USD 貨幣市場線是全部 180 隻中最便宜的兩隻（OCF 0.30%／0.43%），短久期線為 0.67%／0.89%，而債券中位 OCF 1.34%、股票中位 1.86%。保護成本約為中位股票線的五分之一。(3) **黃金是最尖銳的取捨，而且與資料相反**：計劃內唯一的通脹相關線是 EUR 計價、衍生品旗標、3 年 Sharpe 為負（−0.46）、5 年約 −4.75%。而四條貴金屬／礦業線卻佔 Energy/Resources 的 3 年 Sharpe 前四——機械式「按 3 年 Sharpe 排名」會選中它們，因此需要書面推翻。(4) **HKD 在物理上無法表達**：零 HKD 貨幣市場、180 隻中僅一隻 HKD 債券、8 隻 HKD 全是股票。(5) **大中華是算術上的價值陷阱**：該區 5 年 gross 均值 +1.03%，而 OCF 拖累 1.91pp/年——費用超過整個五年的 gross 回報，5 年 gross 中位數為 −0.46%。(6) **本計劃的結構性事實**：180 隻中 150 隻為 Broad 板塊，板塊調倉在此無處表達；傾斜只能透過地區與資產類別。
  - generic [ref=e144]:
    - heading "1b. 收費層" [level=2] [ref=e145]
    - generic [ref=e146]:
      - paragraph [ref=e147]: "**本計劃沒有保單層費用。** 投資選擇的買入／賣出差價（bid-offer spread）為 **0%**，且在 180/180 行以數值核實（bid == offer）。這與其他 ILAS 不同，因此切換成本只剩基金本身的 OCF 差額。"
      - paragraph [ref=e148]: "**實際成本 ＝ 基金 OCF ＋ 成本保險（COI）。** 本計劃 180 隻投資選擇的 OCF：最低 0.30%、中位數 1.86%、最高 3.31%。分資產類別看，股票中位數 1.86%、債券 1.34%。OCF 差額在**資產類別之間**很大（股票→現金約 1.5pp），在**股票內部**很小（約 0.06pp）——所以在本計劃建立杠鈴的成本很低。"
      - paragraph [ref=e149]: "**COI 為合約成本，不在基金回報之內，且在良好年份亦無法追回：** 60 歲以上約 2.5% p.a.、40 歲約 1.8% p.a.、20–30 歲約 1.5% p.a."
      - paragraph [ref=e150]: "**本報告一律以扣除 OCF 前（gross-of-TER）回報**（`ret_Ny + ter`）作跨基金比較，並以 Sharpe =（gross − 4% 無風險利率）÷ 年化波幅 排序，先用 3 年 Sharpe、再以 5 年回報佐證。OCF 差距 0.30%–3.31%，以淨回報排名會得到相反的結論。"
      - paragraph [ref=e151]: "**5 年 Sharpe 僅 23/180 隻存在**（只有 23 隻有 5 年波幅）。**不得**以 3 年波幅代替 5 年波幅來拼湊 5 年 Sharpe。5 年**回報**則有 174/180 隻可用。"
      - paragraph [ref=e152]: "**MDD（最大回撤）不可用**：本次未以每日 NAV 序列計算。日曆年度最差回報不是 MDD，跨年跌幅更深，故不以年度數字替代。"
      - paragraph [ref=e153]: "**計劃現況：CTF Life Oscar 已停止接受新申請**（CTF 僅餘 Legend 2 與 We Shine 仍然開放）。本報告是對**既有投資組合**的建議，不是開新保單的建議。"
      - paragraph [ref=e154]: "**匯率：** 180 隻中 160 隻為 USD 類別，僅 8 隻 HKD、7 隻 EUR、2 隻 AUD、2 隻 JPY、1 隻 GBP，**並無 HKD 貨幣市場基金**。因此香港投資者在此計劃中是結構性做多 USD（USD/HKD 7.8458，距離 7.85 觸發點 42 pips，單邊），這是繼承而來、且目前正在生效的曝險。"
