    - heading "4. 年齡組合" [level=2] [ref=e2161]
    - paragraph [ref=e2162]: 三個年齡組合共用同一 20 隻可投資名單（10 增長 ＋ 10 收益）。三個組合各用 8 隻：每個權重 ≥10%、合計 100%、單一 house ≤30%。8 隻是算術下限而非偏好——40s 的五個籃子中 15% 的籃子不能拆成兩隻（10+5 非法），故 2+2+2+1+1 恰好 8 隻；60+ 的收益籃需 5 隻（兩隻現金各須過 10% 下限、削減短久期會讓 35% 落在貨幣市場、削減多資產則失去內部緩衝）；20–30s 的 40% 成長需 3 隻，且在 house 上限下 6 隻不可行。三個組合的 house 上限：60+ 為 abrdn 25%；40s 為 BlackRock 30% 與 Ninety One 30%；20–30s 為 Ninety One 30%（後兩者已達上限、零餘裕）。
