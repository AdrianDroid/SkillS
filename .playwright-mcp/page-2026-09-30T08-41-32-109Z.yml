          - cell "13.9" [ref=e2017]
          - cell "1.89" [ref=e2018]
          - 'cell "AI capex, held as the one capped sleeve: at most one technology name and no more than 10%, because the five tech funds'' (1Y,3Y,5Y) vectors correlate 0.981 and a cap-weighted global fund already carries ~27.5% technology, so this is the cheapest of the cluster to hold at 16.81% 3Y vol - below the Broad equity book''s 18.27% - and the only one with a positive 5Y (+15.77%), buying +0.27 of Sharpe instead of the 1.78x volatility the cluster average costs; note the share class is EUR-denominated." [ref=e2019]'
