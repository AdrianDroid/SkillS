          - cell "abrdn SICAV I - Japanese Sustainable Equity Fund (A Acc Hedged USD)" [ref=e2006]
          - cell "50.3" [ref=e2007]
          - cell "30.7" [ref=e2008]
          - cell "19.3" [ref=e2009]
          - cell "1.68" [ref=e2010]
