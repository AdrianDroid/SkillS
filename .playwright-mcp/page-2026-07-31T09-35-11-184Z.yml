              - generic [ref=f172e107]:
                - paragraph [ref=f172e108]: For sub-funds or schemes authorised by the Central Bank of Ireland and not authorised by the UK's Financial Conduct Authority, UK investors should note that the sub-fund is not covered by the UK Financial Ombudsman or the UK Financial Services Compensation scheme. UK Retail investors in the sub-fund have a right to access the alternative dispute resolution scheme in Ireland if they feel their complaint has not been dealt with to their satisfaction. However, UK investors will not have a right to access a compensation scheme in Ireland if either the Sub-Fund’s management company or the depositary should become unable to meet its liabilities to investors. Investors should consider obtaining financial advice and review the Prospectus and Supplement before investing.
                - paragraph [ref=f172e109]:
                  - strong [ref=f172e110]: The assets of the Barings Europe Select Fund within Barings Investment Funds plc was merged into the Barings Europe Select Fund within the Barings International Umbrella Fund on 14 October 2022. The Fund’s previous track record with the inception date as at 8 February 2019 has been continued.
                - paragraph [ref=f172e111]: The Barings Europe Select Fund is an Irish-domiciled fund open to new investors, which mirrors the UK-domiciled Barings Europe Select Trust. The Barings Europe Select Fund maintains the same portfolio management team, has substantially the same objective, performance comparator, fee schedule and other key features as the existing UK-domiciled Barings Europe Select Trust.
                - heading "Objective" [level=2] [ref=f172e112]
                - paragraph [ref=f172e113]: The investment objective of the Fund is to achieve long-term capital growth by investing in Europe excluding the United Kingdom.
                - heading "Strategy" [level=2] [ref=f172e114]
                - paragraph [ref=f172e115]: The Fund will seek to achieve its investment objective by investing at least 75% of its total assets directly and indirectly in equities and equity-related securities (as described below) of smaller companies incorporated in, or exercising the predominant part of their economic activity, or quoted or traded on the stock exchanges in Europe excluding the United Kingdom.
                - heading "Who Should Invest" [level=2] [ref=f172e116]
                - paragraph [ref=f172e117]: The Fund is designed for investors seeking a strategy that targets long-term capital growth by investing in smaller companies in Europe excluding the U.K.
                - heading "Risks" [level=2] [ref=f172e118]
                - paragraph [ref=f172e119]: The value of investments can fall as well as rise and investors may not get back the amount originally invested. The Fund can hold smaller company shares which can be more difficult to buy and sell as they may trade infrequently, in small volumes and their share prices may fluctuate more than those of larger companies. Changes in exchange rates between the currency of the Fund and the currencies in which the assets of the Fund are valued may also affect the value of the Fund. The Fund may also use derivatives for investment purposes. These are complex instruments that carry the risk of causing increased volatility in the value of the Fund.
