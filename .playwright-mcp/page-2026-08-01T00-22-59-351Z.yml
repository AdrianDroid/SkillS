            - paragraph [ref=f269e1236]: On 29.10.2021 Schroder ISF Emerging Multi-Asset Income changed its name to Schroder ISF Emerging Markets Multi Asset. The Fund does not have a target benchmark. The Fund's performance and volatility should be compared against 50% MSCI Emerging Market Index (USD), 16.7% JPM EMBI Index EM Hard Currency (USD), 16.7% JPM GBI Emerging Market Index - EM Local (USD), 16.7% JPM CEMB Index (USD). The comparator benchmark is only included for performance and risk comparison purposes and does not have any bearing on how the Investment Manager invests the Fund's assets. The Fund's investment universe is expected to have limited overlap with the components of the comparator benchmark. The Investment Manager invests on a discretionary basis and there are no restrictions on the extent to which the Fund's portfolio and performance may deviate from the comparator benchmark. The Investment Manager will invest in companies or sectors not included in the comparator benchmark. The comparator benchmark has been selected because the Investment Manager believes that the benchmark is a suitable comparison for performance purposes given the Fund's investment objective and policy. The benchmark(s) does/do not take into account the environmental and social characteristics or sustainable objective (as relevant) of the Fund.
