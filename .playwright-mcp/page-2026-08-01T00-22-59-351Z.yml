        - region "Source and ratings information" [ref=f269e1110]:
          - paragraph [ref=f269e1113]:
            - strong [ref=f269e1114]: "MSCI:"
            - text: "Certain information contained herein (the “Information”) is sourced from/copyright of MSCI Inc., MSCI Solutions LLC, or their affiliates (“MSCI”), or information providers (together the “MSCI Parties”) and may have been used to calculate scores, signals, or other indicators. The Information is for internal use only and may not be reproduced or disseminated in whole or part without prior written permission. The Information may not be used for, nor does it constitute, an offer to buy or sell, or a promotion or recommendation of, any security, financial instrument or product, trading strategy, or index, nor should it be taken as an indication or guarantee of any future performance. Some funds may be based on or linked to MSCI indexes, and MSCI may be compensated based on the fund’s assets under management or other measures. MSCI has established an information barrier between index research and certain Information. None of the Information in and of itself can be used to determine which securities to buy or sell or when to buy or sell them. For regulatory disclosures mandated under the EU ESG Rating Activities Regulation (Regulation (EU) 2024/3005), please visit www.msci.com/legal/sustainability-and-climate-resources-and-disclosures for methodology and organizational disclosures and https://one.msci.com for rating level disclosures. The Information is provided “as is” and the user assumes the entire risk of any use it may make or permit to be made of the Information. No MSCI Party warrants or guarantees the originality, accuracy and/or completeness of the Information and each expressly disclaims all express or implied warranties. No MSCI Party shall have any liability for any errors or omissions in connection with any Information herein, or any liability for any direct, indirect, special, punitive, consequential or any other damages (including lost profits) even if notified of the possibility of such damages. Source of all performance data, unless otherwise stated: Morningstar, bid to bid, net income reinvested, net of fees. Aggregated SustainEx metric definitions are: Carbon emissions: Environmental and societal cost of carbon emissions (scope 1,2 and 3). Water consumption: Environmental and societal cost of companies’ and countries’ freshwater withdrawal. Assigned based on reported water usage. Avoided carbon emissions: Environmental and societal benefits of activities and technologies that enable system-wide reductions in carbon emissions, including companies’ products and services and country investments in clean energy. Fair pay: Societal benefits or costs of companies over- or under-paying staff relative to local living wages (for regions in which they operate). Alcohol: Societal cost of alcohol consumption (assigned to alcohol producers). Tobacco: Societal cost of smoking (assigned to tobacco producers). Energy exposure definitions are: Coal exposure: Measures the weight of the portfolio exposed to companies deriving revenue from the mining of thermal coal (including lignite, bituminous, anthracite and steam coal) and its sale to external parties. It excludes: revenue from metallurgical coal; coal mined for internal power generation (e.g. in the case of vertically integrated power producers); intra-company sales of mined thermal coal; and revenue from coal trading. Tar sands exposure: Measures the weight of the portfolio exposed to companies deriving revenue from oil sands extraction for a set of companies that own oil sands reserves and disclose evidence of deriving revenue from oil sands extraction. This factor does not include revenue from non-extraction activities (e.g. exploration, surveying, processing, refining); ownership of oil sands reserves with no associated extraction revenues; revenue from intra-company sales. *Coverage, which refers to the percentage of indicator data available at month-end for the underlying holdings of the fund and the benchmark, where applicable."
            - strong [ref=f269e1115]: "Impact scores:"
            - text: These are generated using Schroders’ proprietary tool SustainEx™.
            - strong [ref=f269e1116]: "MSCI ESG Research rating:"
            - text: Produced by MSCI ESG Research as of the “reporting date”. MSCI ESG Research LLC’s (“MSCI ESG”) Fund Metrics and Ratings (the “Information”) provide environmental, social and governance data with respect to underlying securities within more than 31,000 multi-asset class mutual funds and ETFs globally. MSCI ESG is a registered investment adviser under the U.S. Investment Advisers Act of 1940. MSCI ESG materials have not been submitted to, nor received approval from, the U.S. Securities and Exchange Commission or any other regulatory body. None of the Information constitutes an offer to buy or sell, or a promotion or recommendation of, any security, financial instrument or product or trading strategy, nor should it be taken as an indication or guarantee of any future performance, analysis, forecast or prediction. The Information should not be used to determine which securities to buy or sell or when to buy or sell them. The Information is provided “as is” and the user of the Information assumes the entire risk of any use it may make or permit to be made of the Information. Information herein is believed to be reliable but Schroders does not warrant its completeness or accuracy. No responsibility can be accepted for errors of fact or opinion whether on MSCI or Schroders’ part. Reliance should not be placed on the views and information in the document when taking individual investment and/or strategic decisions. Schroders has expressed its own views in this document and these may change. Please note that onward use of the data contained within this document is subject to applicable MSCI licensing requirements. Please note that if you wish to disclose this data for your own purposes, you will need to agree an appropriate licence with MSCI. For further information, please go to
            - strong [ref=f269e1117]:
              - link "MSCI ESG Ratings Further Information." [ref=f269e1118] [cursor=pointer]:
                - /url: https://www.msci.com/data-and-analytics/sustainability-solutions/esg-ratings
            - strong [ref=f269e1119]: SustainEx™
            - text: provides an aggregate estimate of the social and environmental costs and benefits that an issuer may create. It does this by scoring the issuer against a list of indicators – scores may be positive (for example, when an issuer pays more than average living wages) or negative (for example, when an issuer emits carbon). The result is expressed as an aggregate score of the sustainability indicators for each issuer, specifically a notional percentage (positive or negative) of sales or GDP of the relevant underlying issuer. SustainEx™ utilises and is reliant on third party data (including third party estimates) as well as Schroders’ own modelling assumptions, and the outcome may differ from other sustainability tools and measures. Where SustainEx™ relies on data and estimates produced by third parties, Schroders cannot and does not warrant the accuracy, completeness and adequacy of such third party data and estimates. Like any model, SustainEx™ will evolve and develop over time as Schroders continues to assess, refine and add to the metrics and their relative contributions. Generating SustainEx™ scores involves an element of judgment and subjectivity across the different metrics chosen by Schroders, and accordingly Schroders does not accept any liability arising from any inaccuracy or omission in, or the use of or reliance on, SustainEx™ scores. As the model evolves, changes made to how metrics are applied may result in changes to the SustainEx™ score of any issuer and ultimately the overall fund/portfolio score. At the same time, of course, the issuer’s SustainEx™ performance might improve or deteriorate. Schroders’ proprietary sustainability tools including SustainEx™ may not cover all of a fund/portfolio’s holdings from time to time, in which case Schroders may use a range of alternative methods to assess the relevant holding. In addition, certain types of assets (such as cash) are treated as neutral and are therefore not considered by our proprietary tools. Other types of assets such as equity indices and index derivatives may not be considered by our proprietary tools and in such case would be excluded from a product’s sustainability score.
