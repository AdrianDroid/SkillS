            - strong [ref=f269e1096]: "Benchmarks: (If applicable)"
            - text: Some performance differences between the fund and the benchmark may arise because the fund performance is calculated at a different valuation point from the benchmark. The fund is not managed with reference to a benchmark. The comparator benchmark has been selected because the investment manager believes that the benchmark is a suitable comparison for performance purposes given the fund's investment objective and policy.
      - generic "Source and ratings information" [ref=f269e1102]:
