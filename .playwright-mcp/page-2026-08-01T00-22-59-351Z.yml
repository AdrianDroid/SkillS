      - generic [ref=f269e276]:
        - heading "Risk considerations" [level=2] [ref=f269e279]
        - generic [ref=f269e283]:
          - generic [ref=f269e284]:
            - paragraph [ref=f269e285]:
              - strong [ref=f269e286]: "ABS and MBS risk:"
              - text: The fund may invest in mortgage or asset-backed securities. The underlying borrowers of these securities may not be able to pay back the full amount that they owe, which may result in losses to the fund.
            - strong [ref=f269e287]: "Capital risk / distribution policy:"
            - text: As the fund intends to pay dividends regardless of its performance, a dividend may represent a return of part of the amount you invested.
            - paragraph
            - paragraph [ref=f269e288]:
              - strong [ref=f269e289]: "Capital risk / distribution policy:"
              - text: As the fund intends to pay dividends regardless of its performance, a dividend may represent a return of part of the amount you invested.
            - paragraph [ref=f269e290]:
              - strong [ref=f269e291]: "China risk:"
              - text: If the fund invests in the China Interbank Bond Market via the Bond Connect or in China "A" shares via the Shanghai-Hong Kong Stock Connect and Shenzhen-Hong Kong Stock Connect or in shares listed on the STAR Board or the ChiNext, this may involve clearing and settlement, regulatory, operational and counterparty risks. If the fund invests in onshore renminbi-denominated securities, currency control decisions made by the Chinese government could affect the value of the fund's investments and could cause the fund to defer or suspend redemptions of its shares.
            - paragraph [ref=f269e292]:
              - strong [ref=f269e293]: "Counterparty risk:"
              - text: The fund may have contractual agreements with counterparties. If a counterparty is unable to fulfil their obligations, the sum that they owe to the fund may be lost in part or in whole.
            - paragraph [ref=f269e294]:
              - strong [ref=f269e295]: "Credit risk:"
              - text: If a borrower of debt provided by the fund or a bond issuer experiences a decline in financial health, their ability to make payments of interest and principal may be affected, which may cause a decline in the value of the fund.
            - paragraph [ref=f269e296]:
              - strong [ref=f269e297]: "Currency risk:"
              - text: If the fund’s investments are denominated in currencies different to the fund’s base currency, the fund may lose value as a result of movements in foreign exchange rates, otherwise known as currency rates. If the investor holds a share class in a different currency to the base currency of the fund, investors may be exposed to losses as a result of movements in currency rates.
          - generic [ref=f269e298]:
            - paragraph [ref=f269e299]:
              - strong [ref=f269e300]: "Derivatives risk:"
              - text: Derivatives, which are financial instruments deriving their value from an underlying asset, may be used for investment purposes and/ or to manage the portfolio efficiently. A derivative may not perform as expected, may create losses greater than the cost of the derivative and may result in losses to the fund.
            - paragraph [ref=f269e301]:
              - strong [ref=f269e302]: "Emerging markets & frontier risk:"
              - text: Emerging markets, and especially frontier markets, generally carry greater political, legal, counterparty, operational and liquidity risk than developed markets.
            - paragraph [ref=f269e303]:
              - strong [ref=f269e304]: "High yield bond risk:"
              - text: High yield bonds (normally lower rated or unrated) generally carry greater market, credit and liquidity risk meaning greater uncertainty of returns.
            - paragraph [ref=f269e305]:
              - strong [ref=f269e306]: "Liquidity risk:"
              - text: In difficult market conditions, the fund may not be able to sell a security for full value or at all. This could affect performance and could cause the fund to defer or suspend redemptions of its shares, meaning investors may not be able to have immediate access to their holdings.
            - paragraph [ref=f269e307]:
              - strong [ref=f269e308]: "Market risk:"
              - text: The value of investments can go up and down and an investor may not get back the amount initially invested.
            - paragraph [ref=f269e309]:
              - strong [ref=f269e310]: "Operational risk:"
              - text: Operational processes, including those related to the safekeeping of assets, may fail. This may result in losses to the fund.
            - paragraph [ref=f269e311]:
              - strong [ref=f269e312]: "Performance risk:"
              - text: Investment objectives express an intended result but there is no guarantee that such a result will be achieved. Depending on market conditions and the macro economic environment, investment objectives may become more difficult to achieve.
            - paragraph [ref=f269e313]:
              - strong [ref=f269e314]: "Sustainability risk:"
              - text: The fund has environmental and/or social characteristics. This means it may have limited exposure to some companies, industries or sectors and may forego certain investment opportunities, or dispose of certain holdings, that do not align with its sustainability criteria chosen by the investment manager. The fund may invest in companies that do not reflect the beliefs and values of any particular investor.
            - paragraph
