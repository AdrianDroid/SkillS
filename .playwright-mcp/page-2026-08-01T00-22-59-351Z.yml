                      - paragraph [ref=f269e1028]: Coverage*
                - paragraph [ref=f269e1031]: "The sustainability scores of the fund and the benchmark are shown. The benchmark is the 50% MSCI Emerging Market Index (USD), 16.7% JPM EMBI Index EM Hard Currency (USD), 16.7% JPM GBI Emerging Market Index - EM Local (USD), 16.7% JPM CEMB Index (USD).The Schroders Impact score is based on Schroders’ proprietary tool, SustainEx™. SustainEx™ provides an estimate of the potential societal or environmental impact that may be created by the companies and other issuers in which the fund is invested. The result is expressed as a notional percentage (positive or negative) of sales of the relevant underlying companies and other issuers. For example, a SustainEx™ score of +2% would mean a company contributes $2 of relative notional positive impact (i.e. benefits to society) per $100 of sales.We calculate SustainEx™ scores for companies and other issuers in the fund to arrive at the total fund score. The “Overall Impact” shown is a measure of the fund’s estimated impact compared to that of its benchmark, in each case calculated as a relative notional percentage as described above.The “Impact on People” and “Impact on Planet” measure the fund’s estimated underlying benefits and harms, as compared to its benchmark, in each case calculated as a relative notional percentage as described above.For EU/EEA readers: any ESG ratings within the meaning of Regulation (EU) 2024/3005 contained herein are issued by Schroder Investment Management (Europe) S.A., 5 Heinehaff, L-1736 Senningerberg, Luxembourg. For further information, please go to https://www.schroders.com/en/global/individual/sustainability/sustainability-policies-disclosures-and-reports/"
