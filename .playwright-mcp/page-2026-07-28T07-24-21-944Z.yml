      - paragraph [ref=f103e279]:
        - strong [ref=f103e280]: "PIMCO Funds:"
        - text: "Global Investors Series plc is an open-ended investment company with variable capital and with segregated liability between Funds incorporated on 10 December, 1997 and is authorised in Ireland by the Central Bank as an undertaking for collective investment in transferable securities pursuant to the European Communities (Undertakings for Collective Investment in Transferable Securities) Regulations, 2011 (S.I. No. 352 of 2011) as amended. PIMCO Funds: Global Investors Series plc has appointed PIMCO Asia Limited as the Hong Kong Representative. Investors should consider the investment objectives, risks, charges and expenses of the Funds carefully before investing. This and other information are contained in the Fund’s Hong Kong Prospectus, which may be obtained from our website"
        - link "Go to PIMCO Hong Kong's English homepage" [ref=f103e281] [cursor=pointer]:
          - /url: /hk/en
          - text: www.pimco.com/hk
        - text: or by contacting the Hong Kong Representative or your fund distributor and/or financial advisor. Prospective investors should read the Fund’s Hong Kong Prospectus before deciding whether to subscribe for or purchase shares in any of the Funds. Investor may also wish to seek advice from a financial advisor before making a commitment to invest and in the event you choose not to seek advice, you should consider whether the investment is suitable for you.
      - paragraph [ref=f103e282]: The Funds typically offer different share classes, which are subject to different fees and expenses (which may affect performance), have different minimum investment requirements and are entitled to different services. Unless otherwise stated in the prospectus, the Funds referenced in this website is not managed against a particular benchmark or index, and any reference to a particular benchmark or index in this website is made solely for risk or performance comparison purposes.
      - paragraph [ref=f103e283]:
        - text: A
        - strong [ref=f103e284]: "word about risk:"
        - text: Investing in the
        - strong [ref=f103e285]: bond market
        - text: is subject to risks, including market, interest rate, issuer, credit, inflation risk, and liquidity risk. The value of most bonds and bond strategies are impacted by changes in interest rates. Bonds and bond strategies with longer durations tend to be more sensitive and volatile than those with shorter durations; bond prices generally fall as interest rates rise, and low interest rate environments increase this risk. Reductions in bond counterparty capacity may contribute to decreased market liquidity and increased price volatility. Bond investments may be worth more or less than the original cost when redeemed. Currency rates may fluctuate significantly over short periods of time and may reduce the returns of a portfolio. Investing in
        - strong [ref=f103e286]: foreign denominated and/or domiciled securities
        - text: may involve heightened risk due to currency fluctuations, and economic and political risks, which may be enhanced in emerging markets.
        - strong [ref=f103e287]: Mortgage and asset-backed securities
        - text: may be sensitive to changes in interest rates, subject to early repayment risk, and their value may fluctuate in response to the market’s perception of issuer creditworthiness; while generally supported by some form of government or private guarantee there is no assurance that private guarantors will meet their obligations.
        - strong [ref=f103e288]: Inflation-linked bonds (ILBs)
        - text: issued by a government are fixed-income securities whose principal value is periodically adjusted according to the rate of inflation; ILBs decline in value when real interest rates rise.
        - strong [ref=f103e289]: Treasury Inflation-Protected Securities (TIPS)
        - text: are ILBs issued by the U.S. Government. Sovereign securities are generally backed by the issuing government, obligations of U.S. Government agencies and authorities are supported by varying degrees but are generally not backed by the full faith of the U.S. Government; portfolios that invest in such securities are not guaranteed and will fluctuate in value.
        - strong [ref=f103e290]: High-yield, lower-rated, securities
        - text: involve greater risk than higher-rated securities; portfolios that invest in them may be subject to greater levels of credit and liquidity risk than portfolios that do not.
        - strong [ref=f103e291]: Equities
        - text: may decline in value due to both real and perceived general market, economic, and industry conditions.
        - strong [ref=f103e292]: Derivatives
        - text: may involve certain costs and risks such as liquidity, interest rate, market, credit, management and the risk that a position could not be closed when most advantageous. Investing in derivatives could lose more than the amount invested.
        - strong [ref=f103e293]: Diversification
        - text: does not ensure against loss.
      - paragraph [ref=f103e294]: There is no guarantee that these investment strategies will work under all market conditions or are appropriate for all investors and each investor should evaluate their ability to invest long-term, especially during periods of downturn in the market.
      - paragraph [ref=f103e295]: PIMCO does not provide legal or tax advice. Please consult your tax and/or legal counsel for specific tax or legal questions and concerns.
      - paragraph [ref=f103e296]: The views and strategies described may not be appropriate for all investors. This material has been prepared for informational purposes only.
      - paragraph [ref=f103e297]: PIMCO as a general matter provides services to qualified institutions, financial intermediaries and institutional investors. Individual investors should contact their own financial professional to determine the most appropriate investment options for their financial situation. This material contains the current opinions of the manager and such opinions are subject to change without notice. This material has been distributed for informational purposes only and should not be considered as investment advice or a recommendation of any particular security, strategy or investment product. Information contained herein has been obtained from sources believed to be reliable, but not guaranteed. No part of this material may be reproduced in any form, or referred to in any other publication, without express written permission. PIMCO is a trademark of Allianz Asset Management of America LLC in the United States and throughout the world.
