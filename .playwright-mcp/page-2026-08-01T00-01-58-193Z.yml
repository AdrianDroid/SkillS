      - generic [ref=f199e154]:
        - list [ref=f199e157]:
          - listitem [ref=f199e158]: The Fund may invest primarily in fixed income instruments with varying maturities.
          - listitem [ref=f199e159]: Investments in fixed income securities are subject to interest rate, credit and downgrade risks. The Fund is also subject to risks of investing in high yield, below investment grade and unrated securities.
          - listitem [ref=f199e160]: It is subject to risks associated with emerging markets, mortgage-related and other asset-backed securities, sovereign debt, currency, liquidity and repurchase / reverse repurchase transactions.
          - listitem [ref=f199e161]: It may invest more than 10% in non-investment grade securities issued or guaranteed by a single sovereign issuer (e.g. Ukraine, Sri Lanka and Hungary) which may be subject to increased credit risk and risk of default.
          - listitem [ref=f199e162]: It may invest extensively in financial derivative instruments which may involve additional risks (e.g. market, counterparty, liquidity, volatility, and leverage risks).
          - listitem [ref=f199e163]: It may at its discretion pay dividends out of capital directly or effectively, which amounts to a return or withdrawal of part of an investor’s original investment or from any capital gains attributable to the original investment. Any distributions involving the payment of dividends out of the Fund’s capital may result in an immediate reduction of the Fund’s net asset value per share.
          - listitem [ref=f199e164]: Investments involve risks and your investment may suffer significant losses.
          - listitem [ref=f199e165]: Investors should not rely solely on this material and should read the offering document of the Fund for further details including the risk factors.
        - generic [ref=f199e166]:
          - generic [ref=f199e167]:
            - heading "Overview" [level=2] [ref=f199e168]
            - generic [ref=f199e169]:
              - generic [ref=f199e175]:
                - generic [ref=f199e176]:
                  - heading "Fund Description" [level=3] [ref=f199e177]
                  - paragraph [ref=f199e180]: The Income Fund is a portfolio that is actively managed and utilizes a broad range of fixed income securities that seek to produce an attractive level of income while maintaining a relatively low risk profile, with a secondary goal of capital appreciation.
                - generic [ref=f199e181]:
                  - heading "Investor Benefits" [level=3] [ref=f199e182]
                  - paragraph [ref=f199e185]: This fund seeks to meet the needs of investors who are targeting a competitive and consistent level of income without compromising long term capital appreciation. The fund seeks to generate a competitive monthly dividend while also maintaining a focus on the total return objective. The fund aims to achieve this by employing PIMCO's best income-generating ideas across global fixed income sectors with an explicit mandate on risk-factor diversification. The fund offers daily liquidity.
                - generic [ref=f199e186]:
                  - heading "The Fund Advantage" [level=3] [ref=f199e187]
                  - paragraph [ref=f199e190]: "This fund is designed for investors who seek steady income: it takes a broad-based approach to investing in income-generating bonds. The fund taps into multiple areas of the global bond market, and employs PIMCO's vast analytical capabilities and sector expertise to help temper the risks of high income investing. This approach seeks to provide consistent income over the long term."
