              - listitem [ref=f144e2067]:
                - paragraph [ref=f144e2068]: The charges are the fees the fund charges to investors to cover the costs of running the Fund. Additional costs, including transaction fees, will also be incurred. These costs are paid out by the Fund, which will impact on the overall return of the Fund. Fund charges will be incurred in multiple currencies, meaning that payments may increase or decrease as a result of currency exchange fluctuations. All charges will be paid out by the Fund, which will impact on the overall return of the Fund.
              - listitem [ref=f144e2069]:
                - paragraph [ref=f144e2070]: The computation basis of the calendar year performance is based on the calendar year end, NAV-To-NAV, with dividend reinvested. These figures show by how much the share class(es) increased or decreased in value during the calendar year being shown. Performance data has been calculated in share class currency stated above, including ongoing charges and excluding subscription fee and redemption fee you might have to pay. Where no past performance is shown, there was insufficient data available in that year to provide performance. Past performance is not an indicator or a guarantee of future performance. Investors may not get back the full amount invested
              - listitem [ref=f144e2071]:
