            - generic [ref=f109e132]:
              - paragraph [ref=f109e133]:
                - emphasis [ref=f109e134]: "*Barings Developed and Emerging Markets High Yield Bond Fund within Barings Global Umbrella Fund was merged into the Barings Developed and Emerging Markets High Yield Bond Fund within Barings Umbrella Fund plc on 2 December 2022. The previous fund’s track record since the inception date of 19 July 1993 has been carried forward to the new fund."
              - heading "Objective" [level=2] [ref=f109e135]
              - paragraph [ref=f109e136]: The Barings Developed and Emerging Markets High Yield Bond Fund (“the Fund”) seeks to produce a high level of current yield in dollar terms, commensurate with an acceptable level of risk, as determined by the portfolio managers. Any capital appreciation will be incidental.
              - heading "Strategy" [level=2] [ref=f109e137]
              - paragraph [ref=f109e138]: The Fund will seek to achieve its primary investment objective by investing at least 70% of its assets in debt and loan securities of corporations and governments. The Fund intends to invest approximately two-thirds in securities issued from OECD member states and the remaining one-third in securities of issuers operating in developing or emerging countries. In order to achieve a high level of current yield, the Fund intends to invest principally in high yield securities that are rated not lower than B-. The Fund may invest in securities below B- up to 10%.
              - heading "Barings Umbrella Fund Plc - Barings Developed and Emerging Markets High Yield Bond Fund" [level=2] [ref=f109e139]
              - paragraph [ref=f109e140]:
                - text: The special resolution presented at the adjourned extraordinary general meeting (“Adjourned Meeting”) held on 26 September 2022 was passed. The proposed merger will become effective on 2 December 2022. Please refer to the
                - link "EGM circular" [ref=f109e141] [cursor=pointer]:
                  - /url: /globalassets/hong-kong-only/corporate-action-notices/20220818-barings-demhybf-notice-merger-eng.pdf
                - text: dated 18 August 2022 for further details.
