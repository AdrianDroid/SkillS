              - paragraph [ref=f130e359]: • Allianz Global Investors Asia Fund (the “Trust”) is an umbrella unit trust constituted under the laws of Hong Kong pursuant to the Trust Deed. Allianz Thematic Income and Allianz Selection Income and Growth and Allianz Yield Plus Fund are the sub-funds of the Trust (each a “Sub-Fund”) investing in fixed income securities, equities and derivative instruments, each with a different investment objective and/or risk profile.
              - paragraph [ref=f130e360]: • Some Sub-Funds are exposed to significant risks which include investment/general market, company-specific, emerging market, creditworthiness/credit rating/downgrading, default, volatility and liquidity, valuation, sovereign debt, thematic concentration, thematic-based investment strategy, counterparty, interest rate changes, country and region, asset allocation risks and currency (such as exchange controls, in particular RMB), and the adverse impact on RMB share classes due to currency depreciation.
              - paragraph [ref=f130e361]: • A Sub-Fund may invest in asset-backed securities (“ABS”) and mortgage-backed securities (“MBS”) which may be highly illiquid and prone to substantial price volatility. These instruments may be subject to greater general market risk, concentration risk, credit and counterparty default risk, liquidity risk and interest rate risk compared to other debt securities.
              - paragraph [ref=f130e362]: • Some Sub-Funds may invest in high-yield (non-investment grade and unrated) investments and convertible bonds which may be subject to higher risks, such as volatility, creditworthiness, default, interest rate changes, general market and liquidity risks and therefore may adversely impact the net asset value of the Sub-Fund.
              - paragraph [ref=f130e363]: • All Sub-Funds may invest in financial derivative instruments (“FDI”) which may expose to higher leverage, counterparty, liquidity, valuation, volatility, market and over the counter transaction risks. The use of derivatives may result in losses to the Sub-Funds which are greater than the amount originally invested. A Sub-Fund’s net derivative exposure may be up to 50% of its net asset value (“NAV”).
              - paragraph [ref=f130e364]: • These investments may involve risks that could result in loss of part or entire amount of investors’ investment.
              - paragraph [ref=f130e365]: • In making investment decisions, investors should not rely solely on this website.
