                      - emphasis [ref=f130e354]
                  - text: Dividend payments may, at the sole discretion of the Investment Manager, be made out of the Sub-Fund’s capital or effectively out of the Sub-Fund’s capital which represents a return or withdrawal of part of the amount investors originally invested and/or capital gains attributable to the original investment. This may result in an immediate decrease in the NAV per share and the capital of the Sub-Fund available for investment in the future and capital growth may be reduced, in particular for hedged share classes for which the distribution amount and NAV of any hedged share classes (HSC) may be adversely affected by differences in the interests rates of the reference currency of the HSC and the base currency of the respective Sub-Fund, particularly if such HSC are applying the IRD Neutral Policy. Dividend payments are applicable for Class A/AM/AMg/AMi/AMgi/AQ Dis (Annually/Monthly/Quarterly distribution) and for reference only but not guaranteed. Positive distribution yield does not imply positive return. For details, please refer to the Sub-Fund’s distribution policy disclosed in the offering documents.
