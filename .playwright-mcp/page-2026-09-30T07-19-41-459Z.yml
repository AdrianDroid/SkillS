              - paragraph [ref=f130e335]:
                - generic [ref=f130e336]:
                  - strong
                  - text: • Allianz Global Investors Fund (“AGIF”) as an umbrella fund under the UCITS regulations has within it different Sub-Funds investing in fixed income securities, equities, and derivative instruments, each with a different investment objective and/or risk profile.
              - paragraph [ref=f130e337]: • All Sub-Funds may invest in financial derivative instruments (“FDI”) which may expose to higher leverage, counterparty, liquidity, valuation, volatility, market and over the counter transaction risks. A Sub-Fund’s net derivative exposure may be up to 50% of its net asset value (“NAV”).
              - paragraph [ref=f130e338]: • Some Sub-Funds as part of their investments may invest in any one or a combination of the instruments such as fixed income securities, emerging market securities, and/or mortgage-backed securities, asset-backed securities, property-backed securities (especially REITs) and/or structured products and/or FDI, exposing to various potential risks (including leverage, counterparty, liquidity, valuation, volatility, market, fluctuations in the value of and the rental income received in respect of the underlying property, and over the counter transaction risks).
              - paragraph [ref=f130e339]: • Some Sub-Funds may invest in single countries or industry sectors (in particular small/mid cap companies) which may reduce risk diversification. Some Sub-Funds are exposed to significant risks which include investment/general market, country and region, emerging market (such as Mainland China), creditworthiness/credit rating/downgrading, default, asset allocation, interest rate, volatility and liquidity, counterparty, sovereign debt, valuation, credit rating agency, company-specific, currency (in particular RMB), RMB debt securities and Mainland China tax risks.
              - paragraph [ref=f130e340]: • Some Sub-Funds may invest in convertible bonds, high-yield, non-investment grade investments and unrated securities that may be subject to higher risks (including volatility, loss of principal and interest, creditworthiness and downgrading, default, interest rate, general market and liquidity risks) and therefore may adversely impact the net asset value of the Sub-Funds. Convertibles will be exposed prepayment risk, equity movement and greater volatility than straight bond investments.
              - paragraph [ref=f130e341]: • Some Sub-Funds may invest a significant portion of the assets in interest-bearing securities issued or guaranteed by a non-investment grade sovereign issuer (e.g. Philippines) and is subject to higher risks of liquidity, credit, concentration and default of the sovereign issuer as well as greater volatility and higher risk profile that may result in significant losses to the investors.
              - paragraph [ref=f130e342]: • Some Sub-Funds may invest in European countries. The economic and financial difficulties in Europe may get worse and adversely affect the Sub-Funds (such as increased volatility, liquidity and currency risks associated with investments in Europe).
              - paragraph [ref=f130e343]: • Some Sub-Funds may invest in the China A-Shares market, China B-Shares market and/or debt securities directly via the Stock Connect or the China Interbank Bond Market or Bond Connect or other foreign access regimes and/or other permitted means and/or indirectly through all eligible instruments and thus is subject to the associated risks (including quota limitations, change in rule and regulations, repatriation of the Sub-Fund’s monies, trade restrictions, clearing and settlement, China market volatility and uncertainty, China market volatility and uncertainty, potential clearing and/or settlement difficulties, change in economic, social and political policy in the PRC and Mainland China tax risks).
              - paragraph [ref=f130e344]: • Some Sub-Funds may adopt the following strategies, Socially Responsible Investment (Proprietary Scoring) Strategy, SDG-Aligned Strategy, Sustainability Key Performance Indicator Strategy (Relative), Green Bond Strategy, Multi Asset Sustainable Strategy, Sustainability Key Performance Indicator Strategy (Absolute Threshold), Environment, Social and Governance (“ESG”) Score Strategy, and Sustainability Key Performance Indicator Strategy (Absolute). The Sub-Funds may be exposed to sustainable investment risks relating to the strategies (such as foregoing opportunities to buy certain securities when it might otherwise be advantageous to do so, selling securities when it might be disadvantageous to do so, and/or relying on information and data from third party ESG research data providers and internal analyses which may be subjective, incomplete, inaccurate or unavailable and/or reducing risk diversifications compared to broadly based funds). Also, some Sub-Funds may be particularly focusing on the greenhouse gas emissions (“GHG”) efficiency of the investee companies rather than their financial performance. These may have an adverse impact on the performance of the Sub-Funds.
              - paragraph [ref=f130e345]: • Some Sub-Funds may invest in share class with fixed distribution percentage (Class AMf). Investors should note that fixed distribution percentage is not guaranteed. The share class is not an alternative to fixed interest paying investment. The percentage of distributions paid by these share classes is unrelated to expected or past income or returns of these share classes or the Sub-Funds. Distribution will continue even the Sub-Fund has negative returns and may adversely impact the net asset value of the Sub-Fund. Positive distribution yield does not imply positive return.
              - paragraph [ref=f130e346]: • Investment involves risks that could result in loss of part or entire amount of investors’ investment.
              - paragraph [ref=f130e347]: • In making investment decisions, investors should not rely solely on this [website/material].
