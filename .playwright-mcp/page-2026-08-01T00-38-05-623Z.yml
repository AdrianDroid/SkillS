          - paragraph [ref=e909]: You should not submit any confidential or proprietary information via the Site. All information or material submitted through the Site will be deemed to be the property of Janus Henderson. By submitting any information or material to us through the Site, you grant us an unrestricted, irrevocable license to use, reproduce, display, perform, modify, transmit and distribute those materials or information. You also agree that Janus Henderson is free to use for any purpose any ideas, concepts, know-how or techniques that you submit to us through the Site. Janus Henderson shall not be subject to any obligations of confidentiality regarding submitted information, except as agreed by Janus Henderson or as otherwise specifically agreed or required by law. Note that the treatment of the information submitted in accordance with this section does not regard personal information submitted by you.
          - paragraph [ref=e910]:
            - strong [ref=e911]: Jurisdiction, Severability
          - paragraph [ref=e912]: Any action arising out of these Terms and Conditions or the Site shall be litigated in, and only in, courts located in England and Wales, and you agree to submit to the exclusive jurisdiction of those courts and further agree that they are a convenient forum for you.
          - paragraph [ref=e913]: In the event that any provision of these terms is held unenforceable, the validity or enforceability of the remaining provisions will not be affected, and the unenforceable provision will be replaced with an enforceable provision that comes close to the intention underlying the unenforceable provision.
          - paragraph [ref=e914]:
            - strong [ref=e915]: Cookies
          - paragraph [ref=e916]: "We use cookies, small text files transferred to your browser by our website, to help with several aspects of your visit:"
          - list [ref=e917]:
            - listitem [ref=e918]: To allow our web site software to manage your session or visit and the data passed back and forth during your visit and provide you with the ability to login where necessary.
            - listitem [ref=e919]: To allow our site to remember your preferences when you wish it to, such as whether you accept our terms of use, your chosen country and investor type, or remember the login details you use to frequently access your personal content.
            - listitem [ref=e920]: To help with web analytics; the measurement of visits to this site so that we at Janus Henderson and our agents can analyse what advertising, content and functionality is popular and useful, how our site is performing, with the aim of continually improving it. The industry standard software we use for our web analytics is provided by Adobe (Adobe Marketing Cloud) and Google (Google Analytics and DoubleClick).
          - paragraph [ref=e921]: We do not use cookies that provide information to advertising networks or any third parties who might be tracking your activity across multiple sites.
          - paragraph [ref=e922]: "By continuing without disabling cookies we will assume that you are happy to receive them for the purposes outlined above. If you would like to change your cookie settings please use the following links:"
          - list [ref=e923]:
            - listitem [ref=e924]: Disable/enable Adobe cookies
            - listitem [ref=e925]: Control Google web analytics and cookies (browser add-on)
            - listitem [ref=e926]: Control all cookies with your browser (please note some parts of the web site will not function when all cookies are disabled)
            - listitem [ref=e927]: Understand Google’s use of advertising cookies
