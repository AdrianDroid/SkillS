              - paragraph [ref=f197e115]: By accessing this website and the products, services, information, tools and materials that it contains or describes, you acknowledge that you have understood and accept the following terms and conditions of use. Please read these terms and conditions of use carefully before using this website. This website is owned and operated by PIMCO (as this term is defined hereinafter). You may use the materials on this website solely for personal, informational and non-commercial purposes. All rights not expressly granted in these terms and conditions of use are reserved by PIMCO.
              - paragraph [ref=f197e116]:
                - strong [ref=f197e117]: This website includes information on the PIMCO Global Investors Series plc funds which are currently registered for public sale in Hong Kong. It is your responsibility to be aware of and to observe all applicable laws and regulations of any relevant jurisdiction.
              - paragraph [ref=f197e118]:
                - strong [ref=f197e119]: "IMPORTANT INFORMATION on PIMCO Funds: Global Investors Series PLC"
                - text: "PIMCO Funds: Global Investors Series Plc (“PIMCO Funds”) is an umbrella fund under the UCITS regulations and has within it different funds investing in various investments, such as but not limited to fixed income instruments, securities, and financial derivative instruments. Each fund has a different investment objective and/or risk profile."
              - list [ref=f197e120]:
                - listitem [ref=f197e121]: The funds may invest primarily in various kinds of fixed income instruments.
                - listitem [ref=f197e122]: The funds may invest extensively in financial derivative instruments which may involve additional risks (e.g. market, counterparty, liquidity, leverage and volatility risks).
                - listitem [ref=f197e123]: Some funds may make extensive use of derivative including more complex derivative instrument to achieve the investment objectives, this may lead to higher volatility to its net asset value. In adverse situation, the fund’s use of derivative instruments may become ineffective and the fund may suffer significant losses. The use of derivative may give rise to leverage, liquidity, counterparty and valuation risks. Some funds may invest in high yield securities which may entail greater potential price volatility and may be less liquid than higher-rated securities. These investments are subject to interest rate, credit and downgrade risks.
                - listitem [ref=f197e124]: Some funds may be subject to the risk of investing in emerging securities markets and emerging market currencies which may be more volatile, and to concentration risk of investing in a single or in a limited number of market(s) or sector(s)
                - listitem [ref=f197e125]: Some funds may at its discretion pay dividends out of capital directly or effectively, which amounts to a return or withdrawal of part of an investor’s original investment or from any capital gains attributable to the original investment. Any distributions involving the payment of dividends out of the Fund’s capital may result in an immediate reduction of the Fund’s NAV per share.
                - listitem [ref=f197e126]: The fund’s investments may involve risks (e.g. market, counterparty, liquidity, volatility, and leverage risks) that could result in loss of part or entire amount of your investment.
                - listitem [ref=f197e127]: In an extreme scenario, the value of the funds may be worth substantially less than the original amount you have invested and in the worst case could worth nothing.
                - listitem [ref=f197e128]: Investment involves risks and your investment may suffer significant losses. The value of investments and any income from them may go down as well as up.
                - listitem [ref=f197e129]: In making investment decisions, investors should not rely solely on the information on this website and should read the offering documents of the funds for further details including the risk factors.
                - listitem [ref=f197e130]: You should not invest unless the intermediary who sells it to you has advised you that the product is suitable for you and explained how it is consistent with your investment objectives. .
                - listitem [ref=f197e131]: Past performance is not a guarantee or a reliable indicator of future results and no guarantee is being made that similar returns will be achieved in the future.
              - paragraph [ref=f197e132]: The funds referred to in this website are authorized by the Securities and Futures Commission (the “SFC”) for sale to the public in Hong Kong. SFC authorization is not an official recommendation or endorsement of a scheme nor does it guarantee the commercial merits or its performance. It does not mean that a scheme is suitable for investors nor it is an endorsement of its suitability for any particular investor or class of investors. This website and materials contained in this website has not been reviewed by the SFC.
              - paragraph [ref=f197e133]:
                - strong [ref=f197e134]: NO OFFER
                - text: The information contained in this website is not intended as an offer to sell securities or a solicitation to buy PIMCO funds. The goal is to provide general information on PIMCO funds that have been authorized for retail sale in Hong Kong and are available for investment and purchase in Hong Kong. This site is not directed to individuals or organizations for whom such offer or invitation would be unlawful or prohibited.
              - paragraph [ref=f197e135]:
                - strong [ref=f197e136]: NO ADVICE
                - text: No investment advice, tax advice, or legal advice is provided through this website, and you agree that this website will not be used by you for these purposes. You acknowledge that your use of this website and any requests for information are unsolicited. Investors may wish to seek advice from a financial adviser before making a commitment to invest and in the event you choose not to seek advice, you should consider whether the investment is suitable for you.
              - paragraph [ref=f197e137]:
