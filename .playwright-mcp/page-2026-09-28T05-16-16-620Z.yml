    - paragraph [ref=f1e1350]: 三個年齡組合共用同一 8 隻可投資名單。60+ 用 8 隻——4 隻收益倉屬結構所需而非偏好：Amundi 20% ＋ Schroder 20% ＋ BlackRock Global Allocation 10% 後剛好剩 10%，而 UBB01 是唯一可填補者；6 隻則須把 40% 壓在 Amundi＋Schroders 兩家。40s 用 8 隻——4 個權重是 10% 下限，並非等權稀釋。20–30s 用 6 隻——區間上限合計 105%（剔除 UGA01 則 95%），只有加入第 6 隻於 10% 下限才湊足 100%。三個組合單一 house 均 ≤30%、每個權重 ≥10%、全部 100% 投資。
