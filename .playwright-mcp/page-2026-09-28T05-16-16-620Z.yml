      - paragraph [ref=f1e145]:
        - strong [ref=f1e146]: 主題判斷：
        - text: 中央銀行同步收緊、長端走勢突破：聯儲局、歐央行、日銀於五周內相繼加息；2 年期 4.81% 高於政策區間上緣約 81bp，10 年期 5.17% 為 2007 年 7 月以來最高。但核心 CPI 反而回落至 2.4%、達拉斯聯儲庫裁剪平均 PCE 為 2.3%，說明長端上行來自期限溢價與財政供給，而非通脹預期——這是本報告最重要的判斷。取態：減持久期，只有前端票息是可靠定價的回報。第二主題為霍爾木茲海峽的伊朗戰爭油價衝擊（滯脹型；整體 CPI 3.4% 幾乎全由能源貢獻，能源 ＋16.3% y/y），三間央行於 9 月均提及中東。第三：AI 資本開支已由股票主題變成貨品通脹主題——記憶體佔 2026 年超大規模雲商資本開支約三成、DRAM 年內約四倍、日銀明確點名 AI 需求推高半導體價格並支撐 PPI，銅 ＋47.9% y/y 佐證。第四：美股升市極窄（同一週標普 ＋1.21% 而羅素 2000 −0.80%、公用 −3.87%、REIT −2.28%），密歇根消費者信心由 51.7 塌至 48.1，但 VIX 僅 14.87 完全未定價；真正的廣泛贏家是 MSCI EM YTD ＋24.9%。
      - paragraph [ref=f1e147]:
        - strong [ref=f1e148]: 對本計劃的含義：
        - text: 對本計劃的含義：(1) 減持久期——本計劃 28 隻債券中 9 隻為高收益、7 隻風險 4–5，債券部分本質是信用風險而非久期，故以「前端／類現金」而非長債表達；108 隻中僅 4 條短久期線且僅 1 條通過久期核實（Amundi Cash，波幅 0.4959% 即其證明，全包 1.46%），這是結構性限制而非取態問題。(2) 增持新興市場股票（11 隻，3 年 Sharpe 平均 0.774、中位數 0.898，為各區最高，且平均數在剔除單一基金後僅下滑 0.067）。(3) 減持北美洲（其固定收益部分是全計劃唯一負 Sharpe）、大中華（LPR 連 16 個月不變 ＝ 按兵不動而非刺激，恒指兩個月低位）、歐洲（僅 5 隻，屬「不加」而非「減」）。(4) AI 資本開支以結構性增長傾斜表達，不作通脹對沖——若視之為通脹主題，應以黃金／能源／金屬表達，但本計劃黃金／商品僅 1 隻（風險 5、波幅 36.83%、全包 3.8%）且無商品／金屬基金，108 隻中僅 17 隻為板塊分化（5 隻科技）。故傾斜只能透過地區與資產類別表達，而非板塊輪動。
  - generic [ref=f1e149]:
    - heading "1b. 收費層" [level=2] [ref=f1e150]
    - generic [ref=f1e151]:
      - paragraph [ref=f1e152]: 費用結構是本計劃最關鍵的發現。實際成本 ＝「保單層投資選擇費」0.55%–2.10% p.a.（保險公司基金詳情 API details.managementFee；此為 Manulife 就投資選擇收取的費用，並非基金 OCF，兩者必須分開）＋「基金本身 OCF/TER」0.46%–2.72% p.a.（98 隻用 OCF、10 隻用 TER；逐隻以 SFC 基金資料摘要(KFS)、PRIIP KID、基金月報或 FT tearsheet 核實，來源已記於各基金）。
      - paragraph [ref=f1e153]: 全計劃中位數全包成本約 3.47% p.a.，短名單中位數 3.69% p.a.——篩選後反而更貴，因為兩條最便宜的短期債券線在各自事實表上未通過久期核實。此成本量級令 7 個地區中 5 個的 3 年平均 Sharpe 轉為負數：排名次序在成本後仍成立，絕對水平則不成立。
      - paragraph [ref=f1e154]: 所有跨基金比較一律用「扣除 OCF 前（gross-of-TER）」回報，即 net ＋ OCF，並以 Sharpe ＝（gross − 4% 無風險利率）÷ 年化波幅 排序：先 3 年 Sharpe，再以 1 年 Sharpe 確認，5 年僅作參考。絕不以淨回報排名——0.46% 與 2.72% OCF 的差距足以製造完全相反的排名。
      - paragraph [ref=f1e155]: 另須計入成本保險（COI，合約成本，不在基金回報之內，且在良好年份亦無法追回）：60 歲以上約 2.5% p.a.、40 歲約 1.8% p.a.、20–30 歲約 1.5% p.a.。60+ 組合合計拖累 5.76% p.a.（費用 3.26% ＋ COI 2.5%），其 5 年 gross 8.39% 減去全部拖累後僅約 +2.62% p.a.。
      - paragraph [ref=f1e156]: MDD（最大回撤）不可用：本次未以每日 NAV 序列計算。日曆年度最差回報不是 MDD，跨年跌幅更深，故不以年度數字替代。
      - paragraph [ref=f1e157]: 貨幣對沖：多數為未對沖之 USD 股份類別；已知 UUI01 為 USD 對沖類別。計劃 108 隻中無任何日圓債券或貨幣工具，故任何日本／亞洲配置均為未對沖日圓押注。
      - paragraph [ref=f1e158]: 風險提示：計劃 API 的暫停標記不可靠。USG01 與 UAM01 將於 2026-10-30 強制贖回並終止（Manulife IM HK 2026-08-17 通知，信托契約 cl. 28.3(b)，分別因規模過小及底層基金費用上漲），但 API 仍顯示 fundSuspendInd ＝ "N" 及正常 NAV。UMK01（JPMorgan Korea）曾被標示暫停新交易，經核實並無終止公告，屬誤標。
