                - paragraph [ref=f179e1855]: "Copyright - © 2026 Morningstar, Inc. All rights reserved. The information contained herein: (1) is proprietary to Morningstar; (2) may not be copied or distributed; and (3) is not warranted to be accurate, complete or timely. Neither Morningstar nor its content providers are responsible for any damages or losses arising from any use of this information."
              - listitem [ref=f179e1856]:
                - paragraph [ref=f179e1857]: The benchmarks are used for performance comparison purposes. The Russell 3000 Growth Index is considered the Fund's primary benchmark because it consists of growth securities, which is aligned with the investment manager's focus on growth securities in managing the Fund. The performance of the S&P 500 Index may also be provided because it is considered a proxy for the US equity market. While most of the fund's securities will be components of one or both benchmarks, the weightings of the holdings may differ materially from the weightings in the benchmarks. The fund may also invest in securities that are not included in the benchmarks. The fund's percentage exposures to sectors and industries may differ materially from those of the benchmarks.
              - listitem [ref=f179e1858]:
                - paragraph [ref=f179e1859]:
                  - generic [ref=f179e1860]: The Ongoing Charges Figure (OCF)
                  - generic [ref=f179e1862]: /Total Expense Ratio (TER)
                  - generic [ref=f179e1864]: includes the fees paid to the management company, the investment manager and the depository, as well as certain other expenses. The OCF
                  - generic [ref=f179e1866]: /TER
                  - generic [ref=f179e1868]: is calculated by taking the relevant main material costs paid out over the 12-month period indicated and dividing them by the average net assets over the same period. The OCF
                  - generic [ref=f179e1870]: /TER
                  - generic [ref=f179e1872]: does not include all expenses paid by the fund (for example, it does not include what the fund pays for buying and selling securities).
                  - generic [ref=f179e1874]: For a comprehensive list of the types of costs deducted from fund assets, see the prospectus and Product Key Facts.
              - listitem [ref=f179e1876]:
                - paragraph [ref=f179e1877]: The charges are the fees the fund charges to investors to cover the costs of running the Fund. Additional costs, including transaction fees, will also be incurred. These costs are paid out by the Fund, which will impact on the overall return of the Fund. Fund charges will be incurred in multiple currencies, meaning that payments may increase or decrease as a result of currency exchange fluctuations. All charges will be paid out by the Fund, which will impact on the overall return of the Fund.
              - listitem [ref=f179e1878]:
                - paragraph [ref=f179e1879]: The computation basis of the calendar year performance is based on the calendar year end, NAV-To-NAV, with dividend reinvested. These figures show by how much the share class(es) increased or decreased in value during the calendar year being shown. Performance data has been calculated in share class currency stated above, including ongoing charges and excluding subscription fee and redemption fee you might have to pay. Where no past performance is shown, there was insufficient data available in that year to provide performance. Past performance is not an indicator or a guarantee of future performance. Investors may not get back the full amount invested
