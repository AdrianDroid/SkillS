                  - text: This document is intended to be of general interest only. This document should not be construed as individual investment advice or offer or solicitation to buy, sell or hold any shares of fund or security.
                  - strong [ref=f179e1841]: Investment involves risks.
                  - text: Past performance is not an indicator or a guarantee of future performance. The investment returns are calculated on NAV to NAV basis, taking into account of reinvestments and capital gain or loss. The investment returns are denominated in stated currency, which may be a foreign currency other than USD and HKD (“other foreign currency”). US/HK dollar-based investors are therefore exposed to fluctuations in the US/HK dollar / other foreign currency exchange rate. Please refer to the offering documents for further details, including the risk factors.
