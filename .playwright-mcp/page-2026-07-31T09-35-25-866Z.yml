                      - text: •
                      - strong [ref=f179e283]: INVESTMENT INVOLVES RISKS. The value of the Fund can be volatile and investors may not get back the amount originally invested. Past performance is not indicative of future results.
                    - listitem [ref=f179e284]: • Franklin U.S. Opportunities Fund invests principally in equity securities of U.S. companies with strong growth potential across a wide range of sectors.
                    - listitem [ref=f179e285]: • The Fund is subject to market risk, equity risk, warrants risk, convertible securities risk, liquidity risk, concentration risk, growth stocks risk, smaller and midsize companies risk, foreign currency risk, RMB currency and conversion risk, class hedging risk, counterparty risk, Private Investments in Public Equity risk, private companies risk, special purpose acquisition companies risk and derivative instruments risk.
                    - listitem [ref=f179e286]: • Security lending may involve the risk that the borrower may fail to return the securities lent out in a timely manner and the value of the collateral may fall below the value of the securities lent out, which may result in a substantial loss to the Fund.
                    - listitem [ref=f179e287]: • The Fund may at its discretion pay dividends out of the capital or out of gross income of the Fund while paying all or part of the Fund’s fees and expenses out of the capital of the Fund, which results in effectively paying dividends out of capital. Payment of dividends out of capital amounts to a return or withdrawal of part of an investor’s original investment or from any capital gains attributable to that original investment. Any distributions involving payment of dividends out of the Fund’s capital or payment of dividends effectively out of the Fund’s capital (as the case may be) may result in an immediate reduction of the net asset value per share.
                    - listitem [ref=f179e288]: • Investors should not invest based on this marketing material alone. Offering documents should be read for further details, including the risk factors. Before you decide to invest, you should make sure the intermediary has explained to you that the Fund is suitable to you.
